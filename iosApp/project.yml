name: iosApp
options:
  bundleIdPrefix: com.pttlan
  # The app is in Portuguese; the watch's string catalog is written in it (33.3)
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: 16.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: "Este aplicativo precisa de acesso ao microfone para transmitir seu áudio PTT."
        UILaunchScreen: {}
        CFBundleDisplayName: PTT-LAN
        CFBundleName: PTT-LAN
        # Keeps receiving (and the hosted room) alive with the screen locked
        UIBackgroundModes: [audio]
        # iOS 14+: without these, Bonjour never sees the servers and the first LAN connection only raises the
        # local network prompt and fails
        NSLocalNetworkUsageDescription: "O PTT-LAN procura e conecta a servidores e salas na sua rede local."
        NSBonjourServices: [_pttlan._tcp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PTT-LAN
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: 
          - $(inherited)
          - "${SRCROOT}/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - $(inherited)
          - "-framework"
          - "shared"
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        alwaysOutOfDate: true
    postBuildScripts:
      # The IBM Plex fonts are for the Compose screens; SwiftUI uses the system font (32.3), so they only add ~1 MB
      - name: Drop Compose Fonts
        script: rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"/compose-resources/composeResources/*/font
        alwaysOutOfDate: true
    dependencies:
      - framework: ${SRCROOT}/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework
        implicit: true
        embed: false
      - sdk: libsqlite3.tbd
      # Embedded in the iPhone app, which installs it on the paired watch (33.1)
      - target: watchApp
    scheme:
      shared: true
      testTargets:
        - iosAppUITests
  # A remote for the iPhone app (ADR 0013): SwiftUI only, no Kotlin on the watch
  watchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watchApp
    info:
      path: watchApp/Info.plist
      properties:
        CFBundleDisplayName: PTT-LAN
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pttlan.iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PTT-LAN
        PRODUCT_BUNDLE_IDENTIFIER: com.pttlan.iosApp.watchkitapp
        # Must match the iPhone app's, or it refuses to install on the watch
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - watchAppUITests
  watchAppUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: watchAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: watchApp
    dependencies:
      - target: watchApp
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosApp
    dependencies:
      - target: iosApp


