name: iosApp
options:
  bundleIdPrefix: com.pttlan
  deploymentTarget:
    iOS: 16.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: "Este aplicativo precisa de acesso ao microfone para transmitir seu áudio PTT."
        UILaunchScreen: {}
        CFBundleDisplayName: PTT-LAN
        CFBundleName: PTT-LAN
        # Keeps receiving (and the hosted room) alive with the screen locked
        UIBackgroundModes: [audio]
        # iOS 14+: without these, Bonjour never sees the servers and the first LAN connection only raises the
        # local network prompt and fails
        NSLocalNetworkUsageDescription: "O PTT-LAN procura e conecta a servidores e salas na sua rede local."
        NSBonjourServices: [_pttlan._tcp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PTT-LAN
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: 
          - $(inherited)
          - "${SRCROOT}/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - $(inherited)
          - "-framework"
          - "shared"
          # Xcode 16+: Compose references UIViewLayoutRegion, missing from older SDKs
          - "-Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion"
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        alwaysOutOfDate: true
    dependencies:
      - framework: ${SRCROOT}/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework
        implicit: true
        embed: false
      - sdk: libsqlite3.tbd
    scheme:
      shared: true


