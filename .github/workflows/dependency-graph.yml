# Dependency graph of the Gradle build, for the dependency review of pull requests (30.7).
# This part runs with a read-only token, which is what Dependabot's pull requests get: it only builds the graph
# and saves it; dependency-graph-submit.yml sends it to GitHub once this workflow completes.
name: Dependency graph

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate and save the dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-upload
