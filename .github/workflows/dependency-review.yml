# Fails a pull request that brings a dependency with a known high or critical vulnerability (30.7).
# Kept apart from dependency-graph.yml: it waits for the graph, which is only submitted once that workflow ends.
name: Dependency review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Review the dependencies the pull request changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
